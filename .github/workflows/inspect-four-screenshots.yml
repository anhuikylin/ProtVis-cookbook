name: Temporary inspect four uploaded screenshots

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-four-screenshots.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OCR screenshots for module identification
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v tesseract >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq tesseract-ocr
          fi
          for f in \
            PixPin_2026-09-13_22-50-42.png \
            PixPin_2026-09-13_23-10-48.png \
            PixPin_2026-09-13_23-17-46.png \
            PixPin_2026-09-13_23-19-34.png; do
            echo "===== $f ====="
            tesseract "images/screenshots/$f" stdout --psm 11 2>/dev/null | head -n 420 || true
          done
