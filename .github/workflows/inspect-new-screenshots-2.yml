name: Prepare safe Swiss-Model screenshot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-new-screenshots-2.yml"

permissions:
  contents: write

jobs:
  redact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Redact API token field and commit
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          src="images/screenshots/PixPin_2026-09-14_09-22-35.png"
          tmp="images/screenshots/.swissmodel-redacted.png"
          convert "$src" \
            -fill "#F7F7F7" -stroke "#D0D7DE" -strokewidth 2 \
            -draw "rectangle 55,1180 650,1265" \
            -fill "#6B7280" -stroke none -pointsize 26 \
            -draw "text 80,1232 'REDACTED'" \
            "$tmp"
          mv "$tmp" "$src"
          git config user.name "liangfei"
          git config user.email "103125590+anhuikylin@users.noreply.github.com"
          git add "$src"
          git commit -m "docs: redact Swiss-Model API token from screenshot"
          git push origin HEAD:main
