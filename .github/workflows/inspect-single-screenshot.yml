name: Temporary inspect uploaded screenshot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-single-screenshot.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OCR screenshot for module identification
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v tesseract >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq tesseract-ocr
          fi
          echo '===== 20-29-07 ====='
          tesseract images/screenshots/PixPin_2026-09-13_20-29-07.png stdout --psm 11 2>/dev/null | head -n 260 || true
