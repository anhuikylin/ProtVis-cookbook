name: Temporary screenshot history inspection

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-screenshots.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Search screenshot assets across history
        shell: bash
        run: |
          set -euo pipefail
          echo "--- screenshot-like paths across history ---"
          git rev-list --objects --all | grep -Ei 'screenshots|homepage|project-init|PixPin|4136172|6517d164|\.png$|\.webp$|\.avif$' | tail -n 300 || true
          echo "--- large historical blobs ---"
          git rev-list --objects --all | while read sha path; do
            size=$(git cat-file -s "$sha" 2>/dev/null || echo 0)
            if [ "$size" -ge 500000 ]; then printf '%s %s %s\n' "$size" "$sha" "$path"; fi
          done | sort -nr | head -n 100
