name: Temporary screenshot inspection

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-screenshots.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect bundled original assets
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .original_asset_bundle ]; then
            cat .original_asset_bundle/part.* | tr -d '\n\r' | base64 -d > /tmp/original-assets.tar.xz
            file /tmp/original-assets.tar.xz
            echo "--- archive members ---"
            tar -tJf /tmp/original-assets.tar.xz
          fi
      - name: Install OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Inspect uploaded screenshots
        shell: bash
        run: |
          set -euo pipefail
          for f in images/screenshots/PixPin_*.png; do
            echo "===== ${f} ====="
            file "$f"
            echo "--- OCR ---"
            tesseract "$f" stdout --psm 6 2>/dev/null | sed -n '1,260p'
            echo "--- END OCR ---"
          done
