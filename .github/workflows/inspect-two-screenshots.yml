name: Temporary inspect uploaded screenshots

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-two-screenshots.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OCR screenshots for module identification
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v tesseract >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq tesseract-ocr
          fi
          echo '===== 20-57-25 ====='
          tesseract images/screenshots/PixPin_2026-09-13_20-57-25.png stdout --psm 11 2>/dev/null | head -n 320 || true
