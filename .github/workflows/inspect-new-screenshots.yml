name: Temporary inspect new screenshots

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-new-screenshots.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OCR two screenshots for module identification
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v tesseract >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq tesseract-ocr
          fi
          echo '===== 18-34-05 ====='
          tesseract images/screenshots/PixPin_2026-09-13_18-34-05.png stdout --psm 11 2>/dev/null | head -n 220 || true
          echo '===== 18-38-39 ====='
          tesseract images/screenshots/PixPin_2026-09-13_18-38-39.png stdout --psm 11 2>/dev/null | head -n 220 || true
