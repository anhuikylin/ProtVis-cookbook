<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">Diverse proteomics data sources are harmonized into a standardized ProtVis dataset</title>
  <desc id="desc">Comparison between fragmented source-specific proteomics workflows and ProtVis, which imports and parses heterogeneous files, performs quality control and filtering, harmonizes data structure, reshapes the expression matrix, and produces a standardized ProtVis_dataset.</desc>
  <defs>
    <style>
      .t{font-family:Arial,Helvetica,sans-serif;fill:#15273f}.h1{font-size:26px;font-weight:700}.h2{font-size:22px;font-weight:700}.b{font-size:17px}.s{font-size:14px}.xs{font-size:12px}.white{fill:#fff}.red{fill:#c73535}.teal{fill:#087f90}.muted{fill:#6f7d8d}.bold{font-weight:700}
      .src-line{stroke:#c8d2df;stroke-width:1}.flow-red{fill:none;stroke:#eb625f;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.flow-teal{fill:none;stroke:#0c8195;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:7 7}.thin{stroke-width:1.5}
    </style>
    <linearGradient id="blueHead" x1="0" x2="1"><stop stop-color="#0a3f86"/><stop offset="1" stop-color="#07346f"/></linearGradient>
    <linearGradient id="tealPanel" x1="0" x2="1"><stop stop-color="#d9f2f4"/><stop offset="1" stop-color="#b9e0e5"/></linearGradient>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#eb625f"/></marker>
    <marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#0c8195"/></marker>
  </defs>
