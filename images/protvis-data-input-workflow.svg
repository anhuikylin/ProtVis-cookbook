    <g><line x1="34" y1="208" x2="411" y2="208" class="src-line"/><rect x="40" y="153" width="96" height="46" rx="6" fill="#d72722"/><text x="88" y="173" text-anchor="middle" class="white xs bold">ThermoFisher</text><text x="88" y="190" text-anchor="middle" class="white xs">SCIENTIFIC</text><text x="144" y="174">Proteome</text><text x="144" y="195">Discoverer</text><rect x="318" y="165" width="88" height="32" rx="7" fill="#edf4fd"/><text x="362" y="186" text-anchor="middle" class="s">.txt, .xlsx, .xls</text></g>
    <g><line x1="34" y1="274" x2="411" y2="274" class="src-line"/><text x="42" y="250" class="h2 bold">DIA-NN</text><text x="144" y="250">DIA-NN</text><rect x="318" y="230" width="88" height="32" rx="7" fill="#edf4fd"/><text x="362" y="251" text-anchor="middle" class="s">.tsv</text></g>
