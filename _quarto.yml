format:
  html:
    theme:
      light: [cosmo, assets/theme.scss]
      dark: [darkly, assets/theme-dark.scss]
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    code-copy: true
    code-overflow: wrap
    code-line-numbers: false
    link-external-newwindow: true
    fig-align: center
    fig-responsive: true

execute:
  freeze: auto
